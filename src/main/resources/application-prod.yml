spring:
  application:
    name: fridiet

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: fridiet-storage-bucket
      folder: prod

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  link-redirect-uri: ${KAKAO_LINK_REDIRECT_URI}
  admin-key: ${KAKAO_ADMIN_KEY}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  link-redirect-uri: ${GOOGLE_LINK__REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
firebase:
  config-path: ${FIREBASE_CONFIG_PATH}

ai:
  base-url: ${AI_BASE_URL}
  service-token: ${AI_SERVICE_TOKEN}

frontend:
  redirect-uri: 'fridiet://login-callback'

backend:
  qr-base-url: ${BACKEND_PUBLIC_URL}